<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sua Curadoria — Jogada Ensaiada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --surface:#141414;
    --surface-2:#1E1E1E;
    --border:#2A2A2A;
    --gold:#C9A227;
    --gold-hi:#E0B93D;
    --text:#F3EFE4;
    --muted:#93A19A;
    --danger:#D9534F;
    --ok:#4FAE7A;
    --radius:14px;
    --maxw:560px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans',system-ui,sans-serif;
    min-height:100vh;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:.01em;}
  a{color:inherit;}

  /* ---------- shell ---------- */
  .app{
    max-width:var(--maxw);
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:0 20px 40px;
  }
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,var(--bg) 70%,transparent);
    padding:16px 0 10px;
  }
  .brandrow{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .brandrow img{height:28px; width:auto; display:block;}
  .brandrow .name{font-size:13px; color:var(--muted); letter-spacing:.04em;}

  .clock{
    display:flex; align-items:center; gap:10px;
  }
  .clock-track{
    flex:1; height:6px; border-radius:99px; background:var(--surface-2);
    overflow:hidden; border:1px solid var(--border);
  }
  .clock-fill{
    height:100%; border-radius:99px;
    background:linear-gradient(90deg,#5A5238,var(--gold));
    width:0%; transition:width .35s ease;
  }
  .clock-label{
    font-family:'Anton',sans-serif; font-size:14px; color:var(--gold);
    min-width:64px; text-align:right;
  }

  main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:18px 0;}

  .step{ animation:fade .35s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .eyebrow{ color:var(--gold); font-size:13px; font-weight:600; margin:0 0 6px; }
  h1.step-title{
    font-family:'Anton',sans-serif; font-weight:400;
    font-size:30px; line-height:1.15; margin:0 0 8px;
  }
  p.step-sub{ color:var(--muted); font-size:15px; margin:0 0 22px; max-width:46ch;}

  /* ---------- inputs ---------- */
  label.field-label{
    display:block; font-size:14px; font-weight:600; margin:0 0 6px;
  }
  .field{ margin-bottom:16px; }
  input[type=text],input[type=email],input[type=tel],input[type=date],textarea{
    width:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:14px 14px; color:var(--text); font-size:16px;
    font-family:inherit;
  }
  textarea{min-height:90px; resize:vertical;}
  input::placeholder,textarea::placeholder{color:#5C6D66;}
  input:focus,textarea:focus{ outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold); }
  .hint{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .error-msg{font-size:12.5px; color:var(--danger); margin-top:6px; display:none;}
  .field.has-error input,.field.has-error textarea{border-color:var(--danger);}
  .field.has-error .error-msg{display:block;}

  /* ---------- selectable cards ---------- */
  .grid{ display:grid; gap:10px; }
  .grid.cols-2{ grid-template-columns:1fr 1fr; }
  .opt{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1.5px solid var(--border); border-radius:12px;
    padding:14px 16px; cursor:pointer; user-select:none;
    font-size:15px; font-weight:500;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{ border-color:#3A4D44; }
  .opt.selected{ border-color:var(--gold); background:var(--surface-2); }
  .opt .swatch{ width:14px; height:14px; border-radius:4px; flex:none; border:1px solid rgba(255,255,255,.25); }
  .opt .check{
    margin-left:auto; width:18px; height:18px; border-radius:5px; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--bg); flex:none;
  }
  .opt.selected .check{ background:var(--gold); border-color:var(--gold); }
  .opt.selected .check::after{ content:"✓"; }
  .category-label{display:flex;align-items:center;gap:8px;min-width:0;}
  .help-wrap{position:relative;display:inline-flex;align-items:center;flex:none;}
  .help-button{width:24px;height:24px;border:1px solid var(--gold);border-radius:50%;background:transparent;color:var(--gold);font-weight:700;line-height:1;}
  .help-tip{display:none;position:absolute;z-index:10;left:0;top:calc(100% + 7px);width:min(285px,70vw);padding:11px 13px;background:var(--surface-2);border:1px solid var(--gold);border-radius:9px;color:var(--text);font-size:12px;font-weight:400;line-height:1.5;box-shadow:0 8px 22px #0008;}
  .help-wrap:hover .help-tip,.help-wrap:focus-within .help-tip,.help-wrap.open .help-tip{display:block;}

  .sizegrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .sizeopt{
    text-align:center; padding:12px 0; border-radius:10px; border:1.5px solid var(--border);
    background:var(--surface); cursor:pointer; font-weight:600; font-size:14px;
  }
  .sizeopt.selected{ border-color:var(--gold); background:var(--surface-2); color:var(--gold-hi); }

  fieldset{border:0; margin:0; padding:0;}

  /* ---------- buttons ---------- */
  .actions{ display:flex; gap:10px; margin-top:26px; align-items:center; }
  button{ font-family:inherit; cursor:pointer; }
  .btn-primary{
    flex:1; background:var(--gold); color:#1B1404; border:none; border-radius:10px;
    padding:15px 18px; font-size:15.5px; font-weight:700; letter-spacing:.01em;
    transition:background .15s;
  }
  .btn-primary:hover{ background:var(--gold-hi); }
  .btn-primary:disabled{ background:#4A4738; color:#8A8672; cursor:not-allowed; }
  .btn-ghost{
    background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:10px;
    padding:15px 16px; font-size:15px;
  }
  .btn-ghost:hover{ border-color:#3A4D44; color:var(--text); }
  .link-btn{ background:none; border:none; color:var(--gold); text-decoration:underline; font-size:14px; padding:0; }

  /* ---------- misc ---------- */
  .banner{ border-radius:10px; padding:12px 14px; font-size:13.5px; margin-top:14px; }
  .banner.ok{ background:rgba(79,174,122,.12); border:1px solid rgba(79,174,122,.4); color:#9BD8B6; }
  .banner.warn{ background:rgba(217,83,79,.1); border:1px solid rgba(217,83,79,.35); color:#F0A9A6; }
  #cepResult .banner{background:var(--surface);border:1px solid var(--border);color:#BDBDBD;font-size:13px;}
  #f_cep.has-error input{border-color:#777;}
  #f_cep .error-msg{color:#BDBDBD;}
  .spinner{ display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.25); border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .review-list{ list-style:none; padding:0; margin:0 0 18px; display:flex; flex-direction:column; gap:8px;}
  .review-list li{
    display:flex; justify-content:space-between; gap:12px; font-size:14px;
    border-bottom:1px dashed var(--border); padding-bottom:8px;
  }
  .review-list .k{ color:var(--muted); }
  .review-list .v{ text-align:right; font-weight:600; }
  .edit-link{ font-size:12.5px; }

  .plans{ display:flex; flex-direction:column; gap:12px; }
  .box-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px;}
  .box-switch button{padding:13px 10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-weight:700;}
  .box-switch button.selected{border-color:var(--gold);background:var(--surface-2);color:var(--gold-hi);}
  .box-description{font-size:13.5px;color:var(--muted);margin:0 0 18px;}
  .plan{
    border:1.5px solid var(--border); border-radius:14px; padding:18px; background:var(--surface);
    position:relative;
  }
  .plan.featured{ border-color:var(--gold); background:var(--surface-2); }
  .plan .badge{
    position:absolute; top:-11px; right:16px; background:var(--gold); color:#1B1404;
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; letter-spacing:.03em;
  }
  .plan h3{ font-family:'Anton',sans-serif; font-weight:400; font-size:18px; margin:0 0 4px; }
  .plan .price{ font-size:24px; font-weight:700; color:var(--gold-hi); margin-bottom:2px; }
  .plan .price .old{ font-size:14px; color:var(--muted); text-decoration:line-through; font-weight:500; margin-right:6px;}
  .plan .price small{ font-size:13px; color:var(--muted); font-weight:500; }
  .plan p.desc{ font-size:13px; color:var(--muted); margin:6px 0 12px; }
  .plan ul{ list-style:none; padding:0; margin:0 0 14px; font-size:13.5px; }
  .plan ul li{ margin-bottom:5px; }
  .plan ul li::before{ content:"✓ "; color:var(--ok); }
  .plan button{ width:100%; }

  .hero-badges{ display:flex; gap:14px; flex-wrap:wrap; margin-top:22px; }
  .hero-badges span{ font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .hero-badges span::before{ content:"●"; color:var(--gold); font-size:8px; }

  .tag-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .tag{
    padding:9px 13px; border-radius:99px; border:1.5px solid var(--border); background:var(--surface);
    font-size:13.5px; cursor:pointer;
  }
  .tag.selected{ border-color:var(--gold); background:var(--surface-2); color:var(--gold-hi); }

  footer.legal{ text-align:center; font-size:11.5px; color:#5C6D66; padding:20px 0 0; }

  @media (max-width:380px){
    h1.step-title{ font-size:26px; }
    .sizegrid{ grid-template-columns:repeat(4,1fr); }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brandrow">
      <img src="logo-jogada-ensaiada.png" alt="Jogada Ensaiada">
      <span class="name">Sua curadoria</span>
    </div>
    <div class="clock" id="clockWrap" style="display:none;">
      <div class="clock-track"><div class="clock-fill" id="clockFill"></div></div>
      <div class="clock-label" id="clockLabel">0' / 90'</div>
    </div>
  </header>

  <main id="main"></main>

  <footer class="legal">Jogada Ensaiada · pagamento processado com segurança via Asaas</footer>
</div>

<script>
/* =========================================================
   ESTADO
   ========================================================= */
const state = {
  step: 0,
  data: {
    clube: null,
    nome: '', whatsapp: '', email: '', nascimento: '',
    cep: '', cidade: '', cepOk: null, cepDentroArea: false,
    modelagem: null,
    tamanho: null, tamanhoMasculino: null, tamanhoFeminino: null,
    estilo: null, estiloExtra: [],
    categorias: [],
    origem: null,
    obs: '',
    aceiteWhats: false, aceiteTermos: false,
    cupom: '', cupomValido: false, tipoCaixa: 'classica'
  }
};

const CLUBES = [
  {id:'botafogo', nome:'Botafogo', cor:'#0A0A0A'},
  {id:'flamengo', nome:'Flamengo', cor:'#C8102E'},
  {id:'fluminense', nome:'Fluminense', cor:'#7A1428'},
  {id:'vasco', nome:'Vasco da Gama', cor:'#0A0A0A'},
];

const CIDADES_ATENDIDAS = ['Rio de Janeiro','Niterói','São Gonçalo','Duque de Caxias','Nova Iguaçu','Nilópolis','São João de Meriti','Queimados'];

const TAMANHOS_MASCULINO = ['P','M','G','GG','XG','XXG','XXXG'];
const TAMANHOS_FEMININO = ['PP','P','M','G','GG','XG'];
const TAMANHOS_INFANTIL = ['2','4','6','8','10','12','14'];

const ESTILOS = ['Retrô','Esportivo','Casual','Social','Moda Praia'];
const CATEGORIAS = [
  {nome:'Vestuário', exemplos:'Camisa de Jogo, Camisa Retrô, Camisa Casual, Regata, Agasalho, Corta Vento, Short, Calça'},
  {nome:'Acessórios', exemplos:'Boné, Mochilas e Bolsas, Canecas e Copos, Chinelo, Meia, Touca'},
  {nome:'Casa e Decoração', exemplos:'Quadros e Pôsteres, Desenhos autorais, Bandeira, Itens de bar, Decoração geral'},
  {nome:'Colecionáveis', exemplos:'Itens de coleção do seu clube, como pins, miniaturas e peças comemorativas'}
];
const ORIGENS = ['Instagram','TikTok','Indicação de um amigo','Google / busca','Outro'];

// Links Asaas (padrão e variante com cupom) — mesmos planos já usados hoje
const PLANOS = {
  padrao: {
    mensal:   {preco:'149,90', link:'https://www.asaas.com/c/q18x6viplbjzrubw'},
    trimestral:{preco:'134,90', link:'https://www.asaas.com/c/3l9jh2rbcx21dumh'},
    anual:    {preco:'124,90', link:'https://www.asaas.com/c/vcvruvhhyx6w01oo'}
  },
  cupom: {
    mensal:    {precoDe:'149,90', preco:'134,90', link:'https://www.asaas.com/c/gjqfrsqpx0sy2sr0'},
    trimestral:{precoDe:'134,90', preco:'120,90', link:'https://www.asaas.com/c/2ypa540cf4g2yujw'},
    anual:     {preco:'124,90', link:'https://www.asaas.com/c/vcvruvhhyx6w01oo'} // sem variante própria hoje
  }
};
// Preencher quando o link de assinatura mensal de R$ 300 estiver disponível.
const PREMIUM_PAYMENT_LINK = '';

// Cupons ativos válidos de exemplo — troque/expanda aqui
const CUPONS_VALIDOS = ['JOGA10'];

// Web App já usado pelo formulário anterior da Jogada Ensaiada.
const GOOGLE_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbywwrJCB0ahROfiHboeJ8nIeuPfcaLqxtopPE0wO3oth2WyxhmrJZVHSMGTfKrW7Kc/exec';

/* =========================================================
   DEFINIÇÃO DOS PASSOS
   ========================================================= */
const steps = [
  { id:'hero', progress:false },
  { id:'clube', title:'Qual é o seu time do coração?', sub:'É a partir dele que a gente monta toda a sua curadoria.' },
  { id:'dados', title:'Agora vamos nos conhecer', sub:'A gente só usa isso pra falar com você sobre a sua caixa — sem spam.' },
  { id:'cep', title:'Sua região está na nossa rota?', sub:'Hoje a entrega é focada em pontos do Rio. O endereço completo é só na etapa de pagamento.' },
  { id:'modelagem', title:'Modelagem', sub:'Pra sua camisa vestir do jeito certo.' },
  { id:'tamanho', title:'Qual o tamanho ideal?', sub:'Com base na modelagem que você escolheu.' },
  { id:'estilo', title:'Qual estilo tem mais a ver com você?', sub:'Escolha o principal — dá pra somar outros depois.' },
  { id:'categorias', title:'O que você mais curte receber?', sub:'Pode marcar mais de uma opção.' },
  { id:'origem', title:'Como você chegou até a Jogada Ensaiada?', sub:'Ajuda a gente a saber onde estamos chegando.' },
  { id:'consentimento', title:'Últimos detalhes', sub:'O resto da curadoria (material, peças que você já tem, etc.) a gente combina com você pelo WhatsApp depois que a assinatura entrar.' },
  { id:'checkout', progress:false }
];

/* =========================================================
   RENDER
   ========================================================= */
const main = document.getElementById('main');
const clockWrap = document.getElementById('clockWrap');
const clockFill = document.getElementById('clockFill');
const clockLabel = document.getElementById('clockLabel');

function saveDraft(){
  try{ localStorage.setItem('je_draft', JSON.stringify(state)); }catch(e){}
}
function loadDraft(){
  try{
    const raw = localStorage.getItem('je_draft');
    if(raw){
      const parsed = JSON.parse(raw);
      // Recupera os dados já preenchidos, mas o formulário sempre começa
      // do início (tela inicial) — nunca pula direto para uma etapa salva.
      if(parsed && parsed.data) Object.assign(state.data, parsed.data);
    }
  }catch(e){}
}

function goTo(idx){
  state.step = idx;
  saveDraft();
  render();
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}
function next(){ if(state.step < steps.length-1) goTo(state.step+1); }
function back(){ if(state.step > 0) goTo(state.step-1); }

function updateClock(){
  const s = steps[state.step];
  if(!s || s.progress === false){ clockWrap.style.display='none'; return; }
  clockWrap.style.display='flex';
  // conta só os passos "com progresso"
  const progressSteps = steps.filter(s=>s.progress!==false);
  const curIndex = progressSteps.findIndex(s=>s===steps[state.step]);
  const pct = Math.round(((curIndex+1)/progressSteps.length)*90);
  clockFill.style.width = Math.min(pct,90) + '%';
  clockLabel.textContent = Math.min(pct,90) + "' / 90'";
}

function render(){
  updateClock();
  const s = steps[state.step];
  main.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'step';
  wrap.appendChild(renderers[s.id]());
  main.appendChild(wrap);
}

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function header(title, sub){
  return `<h1 class="step-title">${title}</h1><p class="step-sub">${sub}</p>`;
}

/* ---------- passo: hero ---------- */
function renderHero(){
  const box = el(`
    <div>
      <h1 class="step-title">Sua caixa, com a cara do seu time</h1>
      <p class="step-sub">Responde umas perguntas rápidas e a gente cuida do resto: camisa, estilo e tamanho certos, todo mês na sua casa.</p>
      <div class="actions">
        <button class="btn-primary" id="startBtn">Bora montar minha caixa</button>
      </div>
      <div class="hero-badges">
        <span>Menos de 2 minutos</span>
        <span>Frete grátis</span>
        <span>Pagamento seguro via Asaas</span>
      </div>
    </div>
  `);
  box.querySelector('#startBtn').onclick = next;
  return box;
}

/* ---------- passo: clube ---------- */
function renderClube(){
  const box = el(`<div>${header(steps[state.step].title, steps[state.step].sub)}
    <div class="grid cols-2" id="clubeGrid"></div>
    <div class="actions">
      <button class="btn-ghost" id="backBtn">Voltar</button>
      <button class="btn-primary" id="nextBtn" ${state.data.clube?'':'disabled'}>Continuar</button>
    </div>
  </div>`);
  const grid = box.querySelector('#clubeGrid');
  CLUBES.forEach(c=>{
    const opt = el(`<div class="opt ${state.data.clube===c.id?'selected':''}">
        <span class="swatch" style="background:${c.cor}"></span>
        <span>${c.nome}</span>
        <span class="check"></span>
      </div>`);
    opt.onclick = ()=>{
      state.data.clube = c.id;
      saveDraft();
      render();
    };
    grid.appendChild(opt);
  });
  box.querySelector('#backBtn').onclick = back;
  box.querySelector('#nextBtn').onclick = next;
  return box;
}

/* ---------- passo: dados pessoais ---------- */
function idadeValida(dataStr){
  if(!dataStr) return false;
  const nasc = new Date(dataStr);
  const hoje = new Date();
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const m = hoje.getMonth() - nasc.getMonth();
  if(m < 0 || (m===0 && hoje.getDate() < nasc.getDate())) idade--;
  return idade >= 18;
}
function renderDados(){
  const d = state.data;
  const box = el(`<div>${header(steps[state.step].title, steps[state.step].sub)}
    <div class="field" id="f_nome">
      <label class="field-label">Nome completo</label>
      <input type="text" id="i_nome" placeholder="Como podemos te chamar" value="${d.nome}">
      <div class="error-msg">Digite seu nome completo.</div>
    </div>
    <div class="field" id="f_whats">
      <label class="field-label">WhatsApp</label>
      <input type="tel" id="i_whats" placeholder="(21) 90000-0000" value="${d.whatsapp}">
      <div class="hint">É por aqui que fechamos os últimos detalhes da sua curadoria.</div>
      <div class="error-msg">Digite um WhatsApp válido com DDD.</div>
    </div>
    <div class="field" id="f_email">
      <label class="field-label">E-mail</label>
      <input type="email" id="i_email" placeholder="voce@email.com" value="${d.email}">
      <div class="error-msg">Digite um e-mail válido.</div>
    </div>
    <div class="field" id="f_nasc">
      <label class="field-label">Data de nascimento</label>
      <input type="date" id="i_nasc" value="${d.nascimento}">
      <div class="hint">Você precisa ter pelo menos 18 anos para assinar.</div>
      <div class="error-msg">É preciso ter 18 anos ou mais para assinar.</div>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="backBtn">Voltar</button>
      <button class="btn-primary" id="nextBtn">Continuar</button>
    </div>
  </div>`);

  box.querySelector('#backBtn').onclick = back;
  box.querySelector('#nextBtn').onclick = ()=>{
    let ok = true;
    const nome = box.querySelector('#i_nome').value.trim();
    const whats = box.querySelector('#i_whats').value.trim();
    const email = box.querySelector('#i_email').value.trim();
    const nasc = box.querySelector('#i_nasc').value;

    toggleError('#f_nome', nome.length < 3); if(nome.length<3) ok=false;
    const whatsOk = whats.replace(/\D/g,'').length >= 10;
    toggleError('#f_whats', !whatsOk); if(!whatsOk) ok=false;
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    toggleError('#f_email', !emailOk); if(!emailOk) ok=false;
    const idadeOk = idadeValida(nasc);

    if(!ok) return;

  function toggleError(sel, hasError){

/* ---------- passo: CEP ---------- */
function renderCep(){
  const d = state.data;
  const box = el(`<div>${header(steps[state.step].title, steps[state.step].sub)}
    <div class="field" id="f_cep">
      <label class="field-label" for="i_cep">CEP (opcional)</label>
      <input type="text" id="i_cep" placeholder="00000-000" value="" aria-describedby="cepResult" inputmode="numeric" autocomplete="postal-code" maxlength="9">
      <div class="error-msg">Digite um CEP válido.</div>
    </div>
    <button class="btn-ghost" id="checkBtn" style="width:100%;">Consultar CEP</button>
    <div id="cepResult" role="status" aria-live="polite" aria-atomic="true"></div>
    <p style="margin-top:18px;"><button class="link-btn" id="toggleCidades">Ver cidades atendidas</button></p>
    <div id="cidadesBox" style="display:none;" class="hint">${CIDADES_ATENDIDAS.join(' · ')}. Outras regiões podem ser avaliadas pela equipe.</div>
    <div class="actions">
      <button class="btn-ghost" id="backBtn">Voltar</button>
      <button class="btn-primary" id="nextBtn">Continuar</button>
    </div>
  </div>`);

  const input = box.querySelector('#i_cep');
  const checkBtn = box.querySelector('#checkBtn');
  const resultBox = box.querySelector('#cepResult');
  input.value = String(d.cep || '').replace(/\D/g,'').slice(0,8).replace(/^(\d{5})(\d)/, '$1-$2');
  let requestId = 0;
  let activeController;
  function resetResult(){
    d.cidade = '';
    d.cepOk = false;
    d.cepDentroArea = false;
  }
  resetResult();
  const normalizarTexto = texto => String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  input.addEventListener('input', ()=>{
    let v = input.value.replace(/\D/g,'').slice(0,8);
    if(v.length>5) v = v.slice(0,5)+'-'+v.slice(5);
    input.value = v;
    input.removeAttribute('aria-invalid');
    requestId++;
    if(activeController) activeController.abort();
    d.cep = v;
    d.cidade = '';
    d.cepOk = false;
    d.cepDentroArea = false;
    checkBtn.disabled = false;
    resultBox.replaceChildren();
    box.querySelector('#f_cep').classList.remove('has-error');
    saveDraft();
  });

  box.querySelector('#toggleCidades').onclick = ()=>{
    const el = box.querySelector('#cidadesBox');
    el.style.display = el.style.display==='none' ? 'block' : 'none';
  };

  async function consultarFonte(url, transformar, timeoutMs = 8000){
    const controller = new AbortController();
    activeController = controller;
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try{
      const response = await fetch(url, {signal:controller.signal});
      if(response.status === 404) throw new Error('CEP_NAO_ENCONTRADO');
      if(!response.ok) throw new Error('Fonte indisponível');
      const dados = await response.json();
      const endereco = transformar(dados);
      if(!endereco || !endereco.cidade || !endereco.uf) throw new Error('CEP_NAO_ENCONTRADO');
      return endereco;
    }finally{
      clearTimeout(timer);
    }
  }

  async function consultarCep(){
    const raw = input.value.replace(/\D/g,'');
    if(checkBtn.disabled) return;
    resetResult();
    d.cep = input.value;
    saveDraft();
    if(raw.length !== 8){
      input.setAttribute('aria-invalid', 'true');
      resultBox.innerHTML = `<div class="banner warn">Digite um CEP válido com 8 números.</div>`;
      return;
    }
    input.removeAttribute('aria-invalid');
    const currentRequest = ++requestId;
    box.querySelector('#f_cep').classList.remove('has-error');
    checkBtn.disabled = true;
    resultBox.innerHTML = `<div class="banner ok"><span class="spinner"></span>Consultando CEP...</div>`;
    try{
      let endereco;
      try{
        endereco = await consultarFonte(
          `https://viacep.com.br/ws/${raw}/json/`,
          dados => dados.erro ? null : {cidade:dados.localidade, uf:dados.uf}
        );
      }catch(viacepError){
        if(currentRequest !== requestId) return;
        if(viacepError.message === 'CEP_NAO_ENCONTRADO') throw viacepError;
        // A segunda fonte mantém a consulta disponível quando o ViaCEP falhar.
        endereco = await consultarFonte(
          `https://brasilapi.com.br/api/cep/v2/${raw}`,
          dados => ({cidade:dados.city, uf:dados.state})
        );
      }
      if(currentRequest !== requestId) return;
      const atendida = String(endereco.uf).toUpperCase() === 'RJ'
        && CIDADES_ATENDIDAS.some(c => normalizarTexto(c) === normalizarTexto(endereco.cidade));
      d.cep = raw.slice(0,5) + '-' + raw.slice(5);
      input.value = d.cep;
      d.cidade = endereco.cidade;
      d.cepOk = true;
      d.cepDentroArea = atendida;
      const banner = document.createElement('div');
      banner.className = `banner ${atendida ? 'ok' : 'warn'}`;
      banner.textContent = atendida
        ? `CEP dentro da área de entrega. Cidade identificada: ${endereco.cidade}. O endereço completo será informado na etapa de pagamento.`
        : `CEP fora da área própria. Cidade identificada: ${endereco.cidade}. Você pode continuar a curadoria. Nossa equipe confirmará a disponibilidade e as condições de entrega para sua região.`;
      resultBox.replaceChildren(banner);
    } catch(e){
      if(currentRequest === requestId){
        const banner = document.createElement('div');
        banner.className = 'banner warn';
        banner.textContent = e.name === 'AbortError'
          ? 'A consulta demorou demais. Verifique sua conexão e tente novamente.'
          : e.message === 'CEP_NAO_ENCONTRADO'
            ? 'CEP não encontrado. Confira os números e tente novamente.'
            : 'Não foi possível consultar agora. Verifique sua conexão e tente novamente.';
        resultBox.replaceChildren(banner);
        d.cepOk = false;
        d.cepDentroArea = false;
      }
    } finally {
      if(currentRequest === requestId){
        checkBtn.disabled = false;
        saveDraft();
      }
    }
  }
  checkBtn.onclick = consultarCep;
  input.addEventListener('keydown', event => {
    if(event.key === 'Enter'){ event.preventDefault(); consultarCep(); }
  });

  function sair(navegar){
    requestId++;
    if(activeController) activeController.abort();
    navegar();
  }
  box.querySelector('#backBtn').onclick = () => sair(back);
  box.querySelector('#nextBtn').onclick = () => sair(next);
  return box;
}

    const campos = {
      nome:d.nome, email:d.email, telefone:d.whatsapp, nascimento:d.nascimento,
      team:clubNome(d.clube), cep:d.cep, cidadeConsultada:d.cidade,
      cepDentroArea:d.cepDentroArea ? 'Sim' : 'Não consultado ou fora da área',
      modelagem:d.modelagem, tamanho:d.tamanho, estilo:d.estilo,
      estiloExtra:d.estiloExtra.join(', '), categorias:d.categorias.join(', '),
      origem:d.origem, observations:d.obs, aceiteWhats:d.aceiteWhats ? 'Sim' : 'Não',
      aceiteTermos:d.aceiteTermos ? 'Sim' : 'Não', cupom:d.cupom,
      cupomValido:d.cupomValido ? 'Sim' : 'Não', tipoCaixa:d.tipoCaixa,
      planoEscolhido:plano
    };
    const formData = new FormData();
    Object.entries(campos).forEach(([key,value]) => formData.set(key, value == null ? '' : String(value)));
    try{
      // Apps Script recebe FormData; no-cors evita o bloqueio do navegador.
      // A resposta opaca não permite confirmar pelo navegador se o e-mail foi entregue.
      await fetch(GOOGLE_SHEETS_URL, {method:'POST', body:formData, mode:'no-cors'});
      if(link){
        try{ localStorage.removeItem('je_draft'); }catch(e){}
        window.location.href = link;
      } else {
        aviso.innerHTML = '<div class="banner ok">Recebemos sua solicitação da Caixa Premium! Nossa equipe já vai te mandar o link da assinatura mensal de R$ 300.</div>';
      }
    }catch(e){
      aviso.innerHTML = '<div class="banner warn">Não foi possível enviar agora. Verifique sua conexão e tente novamente.</div>';
    }finally{
      enviando = false;
    }
  }

  renderPlanos();
  return box;
}

const renderers = {
  hero: renderHero,
  clube: renderClube,
  dados: renderDados,
  cep: renderCep,
  modelagem: renderModelagem,
  tamanho: renderTamanho,
  estilo: renderEstilo,
  categorias: renderCategorias,
  origem: renderOrigem,
  consentimento: renderConsentimento,
  checkout: renderCheckout
};

/* =========================================================
   BOOT
   ========================================================= */
loadDraft();
render();
</script>
