<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sua Curadoria — Jogada Ensaiada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --surface:#141414;
    --surface-2:#1E1E1E;
    --border:#2A2A2A;
    --gold:#FFB800;
    --gold-hi:#FFCA40;
    --text:#FFFFFF;
    --muted:#A0A0A0;
    --danger:#D9534F;
    --ok:#FFB800;
    --radius:14px;
    --maxw:560px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans',system-ui,sans-serif;
    min-height:100vh;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:.01em;}
  a{color:inherit;}

  /* ---------- shell ---------- */
  .app{
    max-width:var(--maxw);
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:0 20px 40px;
  }
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,var(--bg) 70%,transparent);
    padding:16px 0 10px;
  }
  .brandrow{
    display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px;
  }
  .brandrow img{width:220px; max-width:65vw; height:auto; object-fit:contain; display:block; flex:none;}
  .brandrow .name{font-size:13px; color:var(--muted); letter-spacing:.04em;}

  .clock{
    display:flex; align-items:center; gap:10px;
  }
  .clock-track{
    flex:1; height:6px; border-radius:99px; background:var(--surface-2);
    overflow:hidden; border:1px solid var(--border);
  }
  .clock-fill{
    height:100%; border-radius:99px;
    background:linear-gradient(90deg,#806000,var(--gold));
    width:0%; transition:width .35s ease;
  }
  .clock-label{
    font-family:'Anton',sans-serif; font-size:14px; color:var(--gold);
    min-width:64px; text-align:right;
  }

  main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:18px 0;}

  .step{ animation:fade .35s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .eyebrow{ color:var(--gold); font-size:13px; font-weight:600; margin:0 0 6px; }
  h1.step-title{
    font-family:'Anton',sans-serif; font-weight:400;
    font-size:30px; line-height:1.15; margin:0 0 8px;
  }
  p.step-sub{ color:var(--muted); font-size:15px; margin:0 0 22px; max-width:46ch;}

  /* ---------- inputs ---------- */
  label.field-label{
    display:block; font-size:14px; font-weight:600; margin:0 0 6px;
  }
  .field{ margin-bottom:16px; }
  input[type=text],input[type=email],input[type=tel],input[type=date],textarea{
    width:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:14px 14px; color:var(--text); font-size:16px;
    font-family:inherit;
  }
  textarea{min-height:90px; resize:vertical;}
  input::placeholder,textarea::placeholder{color:#808080;}
  input:focus,textarea:focus{ outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold); }
  .hint{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .error-msg{font-size:12.5px; color:var(--danger); margin-top:6px; display:none;}
  .field.has-error input,.field.has-error textarea{border-color:var(--danger);}
  .field.has-error .error-msg{display:block;}

  /* ---------- selectable cards ---------- */
  .grid{ display:grid; gap:10px; }
  .grid.cols-2{ grid-template-columns:1fr 1fr; }
  .opt{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1.5px solid var(--border); border-radius:12px;
    padding:14px 16px; cursor:pointer; user-select:none;
    font-size:15px; font-weight:500;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{ border-color:#555555; }
  .opt.selected{ border-color:var(--gold); background:var(--surface-2); }
  .opt .check{
    margin-left:auto; width:18px; height:18px; border-radius:5px; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--bg); flex:none;
  }
  .opt.selected .check{ background:var(--gold); border-color:var(--gold); }
  .opt.selected .check::after{ content:"✓"; }
  .category-label{display:flex;align-items:center;gap:8px;min-width:0;}
  .help-wrap{position:relative;display:inline-flex;align-items:center;flex:none;}
  .help-button{width:24px;height:24px;border:1px solid var(--gold);border-radius:50%;background:transparent;color:var(--gold);font-weight:700;line-height:1;}
  .help-tip{display:none;position:absolute;z-index:10;left:0;top:calc(100% + 7px);width:min(285px,70vw);padding:11px 13px;background:var(--surface-2);border:1px solid var(--gold);border-radius:9px;color:var(--text);font-size:12px;font-weight:400;line-height:1.5;box-shadow:0 8px 22px #0008;}
  .help-wrap:hover .help-tip,.help-wrap:focus-within .help-tip,.help-wrap.open .help-tip{display:block;}

  .sizegrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .sizeopt{
    text-align:center; padding:12px 0; border-radius:10px; border:1.5px solid var(--border);
    background:var(--surface); cursor:pointer; font-weight:600; font-size:14px;
  }
  .sizeopt.selected{ border-color:var(--gold); background:var(--surface-2); color:var(--gold-hi); }

  fieldset{border:0; margin:0; padding:0;}

  /* ---------- buttons ---------- */
  .actions{ display:flex; gap:10px; margin-top:26px; align-items:center; }
  button{ font-family:inherit; cursor:pointer; }
  .btn-primary{
    flex:1; background:var(--gold); color:#000000; border:none; border-radius:10px;
    padding:15px 18px; font-size:15.5px; font-weight:700; letter-spacing:.01em;
    transition:background .15s;
  }
  .btn-primary:hover{ background:var(--gold-hi); }
  .btn-primary:disabled{ background:#333333; color:#999999; cursor:not-allowed; }
  .btn-ghost{
    background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:10px;
    padding:15px 16px; font-size:15px;
  }
  .btn-ghost:hover{ border-color:#555555; color:var(--text); }
  .link-btn{ background:none; border:none; color:var(--gold); text-decoration:underline; font-size:14px; padding:0; }

  /* ---------- misc ---------- */
  .banner{ border-radius:10px; padding:12px 14px; font-size:13.5px; margin-top:14px; }
  .banner.ok{ background:rgba(79,174,122,.12); border:1px solid rgba(79,174,122,.4); color:#9BD8B6; }
  .banner.warn{ background:rgba(217,83,79,.1); border:1px solid rgba(217,83,79,.35); color:#F0A9A6; }
  #cepResult .banner{background:var(--surface);border:1px solid var(--border);color:#BDBDBD;font-size:13px;}
  #f_cep.has-error input{border-color:#777;}
  #f_cep .error-msg{color:#BDBDBD;}
  .spinner{ display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.25); border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .review-list{ list-style:none; padding:0; margin:0 0 18px; display:flex; flex-direction:column; gap:8px;}
  .review-list li{
    display:flex; justify-content:space-between; gap:12px; font-size:14px;
    border-bottom:1px dashed var(--border); padding-bottom:8px;
  }
  .review-list .k{ color:var(--muted); }
  .review-list .v{ text-align:right; font-weight:600; }
  .edit-link{ font-size:12.5px; }

  .plans{ display:flex; flex-direction:column; gap:12px; }
  .box-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px;}
  .box-switch button{padding:13px 10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-weight:700;}
  .box-switch button.selected{border-color:var(--gold);background:var(--surface-2);color:var(--gold-hi);}
  .box-description{font-size:13.5px;color:var(--muted);margin:0 0 18px;}
  .plan{
    border:1.5px solid var(--border); border-radius:14px; padding:18px; background:var(--surface);
    position:relative;
  }
  .plan.featured{ border-color:var(--gold); background:var(--surface-2); }
  .plan .badge{
    position:absolute; top:-11px; right:16px; background:var(--gold); color:#000000;
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; letter-spacing:.03em;
  }
  .plan h3{ font-family:'Anton',sans-serif; font-weight:400; font-size:18px; margin:0 0 4px; }
  .plan .price{ font-size:24px; font-weight:700; color:var(--gold-hi); margin-bottom:2px; }
  .plan .price .old{ font-size:14px; color:var(--muted); text-decoration:line-through; font-weight:500; margin-right:6px;}
  .plan .price small{ font-size:13px; color:var(--muted); font-weight:500; }
  .plan p.desc{ font-size:13px; color:var(--muted); margin:6px 0 12px; }
  .plan ul{ list-style:none; padding:0; margin:0 0 14px; font-size:13.5px; }
  .plan ul li{ margin-bottom:5px; }
  .plan ul li::before{ content:"✓ "; color:var(--ok); }
  .plan button{ width:100%; }

  .hero-badges{ display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:22px; text-align:center; }
  .hero-badges span{ font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .hero-badges span::before{ content:"●"; color:var(--gold); font-size:8px; }

  .tag-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .tag{
    padding:9px 13px; border-radius:99px; border:1.5px solid var(--border); background:var(--surface);
    font-size:13.5px; cursor:pointer;
  }
  .tag.selected{ border-color:var(--gold); background:var(--surface-2); color:var(--gold-hi); }

  footer.legal{ text-align:center; font-size:11.5px; color:#808080; padding:20px 0 0; }

  @media (max-width:380px){
    h1.step-title{ font-size:26px; }
    .sizegrid{ grid-template-columns:repeat(4,1fr); }
  }

/* Paleta Jogada Ensaiada: preto, branco e amarelo-dourado */
:root{--brand-gold:#FFB800;--brand-gold-hover:#FFCA40;--brand-black:#000000;--brand-white:#FFFFFF;--brand-muted:#A0A0A0;}
body{background:var(--brand-black);color:var(--brand-white);}

.banner.ok,.banner.warn{background:#141414;border:1px solid #2A2A2A;color:#BDBDBD;}
.error-msg{color:#BDBDBD;}.field.has-error input,.field.has-error textarea{border-color:#808080;}
footer.legal{color:#808080;}.clock-fill{background:linear-gradient(90deg,#806000,#FFB800);}

</style>
</head>

const main = document.getElementById('main');
const clockWrap = document.getElementById('clockWrap');
const clockFill = document.getElementById('clockFill');
const clockLabel = document.getElementById('clockLabel');

function saveDraft(){
  try{ localStorage.setItem('je_draft', JSON.stringify(state)); }catch(e){}
}
function loadDraft(){
  try{
    const raw = localStorage.getItem('je_draft');
    if(raw){
      const parsed = JSON.parse(raw);
      // Recupera os dados já preenchidos, mas o formulário sempre começa
      // do início (tela inicial) — nunca pula direto para uma etapa salva.
      if(parsed && parsed.data) Object.assign(state.data, parsed.data);
    }
  }catch(e){}
}

function goTo(idx){
  state.step = idx;
  saveDraft();
  render();
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}
function next(){ if(state.step < steps.length-1) goTo(state.step+1); }
function back(){ if(state.step > 0) goTo(state.step-1); }

function updateClock(){
  const s = steps[state.step];
  if(!s || s.progress === false){ clockWrap.style.display='none'; return; }
  clockWrap.style.display='flex';
  // conta só os passos "com progresso"
  const progressSteps = steps.filter(s=>s.progress!==false);
  const curIndex = progressSteps.findIndex(s=>s===steps[state.step]);
  const pct = Math.round(((curIndex+1)/progressSteps.length)*90);
  clockFill.style.width = Math.min(pct,90) + '%';
  clockLabel.textContent = Math.min(pct,90) + "' / 90'";
}

function render(){
  updateClock();
  const s = steps[state.step];
  main.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'step';
  wrap.appendChild(renderers[s.id]());
  main.appendChild(wrap);
}

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function idadeValida(dataStr){
  if(!dataStr) return false;
  const nasc = new Date(dataStr);
  const hoje = new Date();
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const m = hoje.getMonth() - nasc.getMonth();
  if(m < 0 || (m===0 && hoje.getDate() < nasc.getDate())) idade--;
  return idade >= 18;
}

/* ---------- passo: CEP ---------- */
function renderCep(){
  const d = state.data;
  const box = el(`<div>${header(steps[state.step].title, steps[state.step].sub)}
    <div class="field" id="f_cep">
      <label class="field-label" for="i_cep">CEP</label>
      <input type="text" id="i_cep" placeholder="00000-000" value="" aria-describedby="cepResult" inputmode="numeric" autocomplete="postal-code" maxlength="9">
      <div class="error-msg">Digite um CEP válido.</div>
    </div>
    <button class="btn-ghost" id="checkBtn" style="width:100%;">Consultar CEP</button>
    <div id="cepResult" role="status" aria-live="polite" aria-atomic="true"></div>
    <p style="margin-top:18px;"><button class="link-btn" id="toggleCidades">Ver cidades atendidas</button></p>
    <div id="cidadesBox" style="display:none;" class="hint">${CIDADES_ATENDIDAS.join(' · ')}. Outras regiões: Entre em contato com o nosso atendimento.</div>
    <div class="actions">
      <button class="btn-ghost" id="backBtn">Voltar</button>
      <button class="btn-primary" id="nextBtn">Continuar</button>
    </div>
  </div>`);

  const input = box.querySelector('#i_cep');
  const checkBtn = box.querySelector('#checkBtn');
  const resultBox = box.querySelector('#cepResult');
  input.value = String(d.cep || '').replace(/\D/g,'').slice(0,8).replace(/^(\d{5})(\d)/, '$1-$2');
  let requestId = 0;
  let activeController;
  function resetResult(){
    d.cidade = '';
    d.cepOk = false;
    d.cepDentroArea = false;
  }
  resetResult();
  const normalizarTexto = texto => String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  input.addEventListener('input', ()=>{
    let v = input.value.replace(/\D/g,'').slice(0,8);
    if(v.length>5) v = v.slice(0,5)+'-'+v.slice(5);
    input.value = v;
    input.removeAttribute('aria-invalid');
    requestId++;
    if(activeController) activeController.abort();
    d.cep = v;
    d.cidade = '';
    d.cepOk = false;
    d.cepDentroArea = false;
    checkBtn.disabled = false;
    resultBox.replaceChildren();
    box.querySelector('#f_cep').classList.remove('has-error');
    saveDraft();
  });

  box.querySelector('#toggleCidades').onclick = ()=>{
    const el = box.querySelector('#cidadesBox');
    el.style.display = el.style.display==='none' ? 'block' : 'none';
  };

  async function consultarFonte(url, transformar, timeoutMs = 8000){
    const controller = new AbortController();
    activeController = controller;
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try{
      const response = await fetch(url, {signal:controller.signal});
      if(response.status === 404) throw new Error('CEP_NAO_ENCONTRADO');
      if(!response.ok) throw new Error('Fonte indisponível');
      const dados = await response.json();
      const endereco = transformar(dados);
      if(!endereco || !endereco.cidade || !endereco.uf) throw new Error('CEP_NAO_ENCONTRADO');
      return endereco;
    }finally{
      clearTimeout(timer);
    }
  }

  async function consultarCep(){
    const raw = input.value.replace(/\D/g,'');
    if(checkBtn.disabled) return;
    resetResult();
    d.cep = input.value;
    saveDraft();
    if(raw.length !== 8){
      input.setAttribute('aria-invalid', 'true');
      resultBox.innerHTML = `<div class="banner warn">Digite um CEP válido com 8 números.</div>`;
      return;
    }
    input.removeAttribute('aria-invalid');
    const currentRequest = ++requestId;
    box.querySelector('#f_cep').classList.remove('has-error');
    checkBtn.disabled = true;
    resultBox.innerHTML = `<div class="banner ok"><span class="spinner"></span>Consultando CEP...</div>`;
    try{
      let endereco;
      try{
        endereco = await consultarFonte(
          `https://viacep.com.br/ws/${raw}/json/`,
          dados => dados.erro ? null : {cidade:dados.localidade, uf:dados.uf}
        );
      }catch(viacepError){
        if(currentRequest !== requestId) return;
        if(viacepError.message === 'CEP_NAO_ENCONTRADO') throw viacepError;
        // A segunda fonte mantém a consulta disponível quando o ViaCEP falhar.
        endereco = await consultarFonte(
          `https://brasilapi.com.br/api/cep/v2/${raw}`,
          dados => ({cidade:dados.city, uf:dados.state})
        );
      }
      if(currentRequest !== requestId) return;
      const atendida = String(endereco.uf).toUpperCase() === 'RJ'
        && CIDADES_ATENDIDAS.some(c => normalizarTexto(c) === normalizarTexto(endereco.cidade));
      d.cep = raw.slice(0,5) + '-' + raw.slice(5);
      input.value = d.cep;
      d.cidade = endereco.cidade;
      d.cepOk = true;
      d.cepDentroArea = atendida;
      const banner = document.createElement('div');
      banner.className = `banner ${atendida ? 'ok' : 'warn'}`;
      banner.textContent = atendida
        ? `CEP dentro da área de entrega. Cidade identificada: ${endereco.cidade}. O endereço completo será informado na etapa de pagamento.`
        : `CEP fora da área própria. Cidade identificada: ${endereco.cidade}. Você pode continuar a curadoria. Nossa equipe confirmará a disponibilidade e as condições de entrega para sua região.`;
      resultBox.replaceChildren(banner);
    } catch(e){
      if(currentRequest === requestId){
        const banner = document.createElement('div');
        banner.className = 'banner warn';
        banner.textContent = e.name === 'AbortError'
          ? 'A consulta demorou demais. Verifique sua conexão e tente novamente.'
          : e.message === 'CEP_NAO_ENCONTRADO'
            ? 'CEP não encontrado. Confira os números e tente novamente.'
            : 'Não foi possível consultar agora. Verifique sua conexão e tente novamente.';
        resultBox.replaceChildren(banner);
        d.cepOk = false;
        d.cepDentroArea = false;
      }
    } finally {
      if(currentRequest === requestId){
        checkBtn.disabled = false;
        saveDraft();
      }
    }
  }
  checkBtn.onclick = consultarCep;
  input.addEventListener('keydown', event => {
    if(event.key === 'Enter'){ event.preventDefault(); consultarCep(); }
  });

  function sair(navegar){
    requestId++;
    if(activeController) activeController.abort();
    navegar();
  }
  box.querySelector('#backBtn').onclick = () => sair(back);
  box.querySelector('#nextBtn').onclick = () => sair(next);
  return box;
}

      <button class="btn-primary" id="nextBtn" ${d.origem?'':'disabled'}>Continuar</button>
    </div>
  </div>`);
  const grid = box.querySelector('#oriGrid');
  ORIGENS.forEach(o=>{
    const opt = el(`<div class="opt ${d.origem===o?'selected':''}"><span>${o}</span><span class="check"></span></div>`);
    opt.onclick = ()=>{ d.origem = o; saveDraft(); render(); };
    grid.appendChild(opt);
  });
  box.querySelector('#backBtn').onclick = back;
  box.querySelector('#nextBtn').onclick = next;
  return box;
}

/* ---------- passo: consentimento ---------- */
function renderConsentimento(){
  const d = state.data;
  const box = el(`<div>${header(steps[state.step].title, steps[state.step].sub)}
    <div class="field">
      <label class="field-label">Alguma observação? (opcional)</label>
      <textarea id="i_obs" placeholder="Alergias a tecidos, preferências extras, o que quiser nos contar">${d.obs}</textarea>
    </div>
    <div class="field" id="f_whatsConsent">
      <div class="opt ${d.aceiteWhats?'selected':''}" id="whatsConsentOpt">
        <span>Quero receber minha curadoria e novidades da Jogada Ensaiada pelo WhatsApp.</span>
        <span class="check"></span>
      </div>
    </div>
    <div class="field" id="f_termos">
      <div class="opt ${d.aceiteTermos?'selected':''}" id="termosOpt">
        <span>Li e aceito os <a href="termos-e-condicoes.html" target="_blank" rel="noopener noreferrer">Termos de Uso</a> e a <a href="politica-de-privacidade.html" target="_blank" rel="noopener noreferrer">Política de Privacidade</a> da Jogada Ensaiada. <strong>(obrigatório)</strong></span>
        <span class="check"></span>
      </div>
      <div class="error-msg">Para continuar, você precisa aceitar os termos.</div>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="backBtn">Voltar</button>
      <button class="btn-primary" id="nextBtn">Ver planos</button>
    </div>
  </div>`);
  box.querySelector('#whatsConsentOpt').onclick = ()=>{ d.obs = box.querySelector('#i_obs').value; d.aceiteWhats = !d.aceiteWhats; saveDraft(); render(); };
  box.querySelector('#termosOpt').onclick = ()=>{ d.obs = box.querySelector('#i_obs').value; d.aceiteTermos = !d.aceiteTermos; saveDraft(); render(); };
  box.querySelectorAll('#termosOpt a').forEach(link => link.onclick = event => event.stopPropagation());
  box.querySelector('#backBtn').onclick = back;
  box.querySelector('#nextBtn').onclick = ()=>{
    d.obs = box.querySelector('#i_obs').value;
    if(!d.aceiteTermos){
      box.querySelector('#f_termos').classList.add('has-error');
      return;
    }
    saveDraft();
    next();
  };
  return box;
}

/* ---------- passo: checkout ---------- */
function clubNome(id){ const c = CLUBES.find(c=>c.id===id); return c ? c.nome : '—'; }

function renderCheckout(){
  const d = state.data;
  const box = el(`<div>
    <p class="eyebrow">Fechou!</p>
    <h1 class="step-title">Sua curadoria está pronta</h1>
    <p class="step-sub">${caixaPreSelecionada ? "Confira seu perfil e continue para o pagamento." : "Dá uma conferida no seu perfil aqui embaixo e escolhe sua caixa."} O resto a gente combina com você no WhatsApp depois que a assinatura entrar.</p>

    <ul class="review-list">
      <li><span class="k">Time</span><span class="v">${clubNome(d.clube)}</span></li>
      <li><span class="k">Modelagem / tamanho</span><span class="v">${d.modelagem} · ${d.tamanho}</span></li>
      <li><span class="k">Estilo</span><span class="v">${d.estilo}</span></li>
      <li><span class="k">Entrega</span><span class="v">${d.cidade || '—'}</span></li>
    </ul>

    <div class="field">
      <p class="field-label">${caixaPreSelecionada ? "Sua caixa" : "Escolha sua caixa"}</p>
      <div class="box-switch" role="group" aria-label="Tipo de caixa" ${caixaPreSelecionada ? 'style="display:none"' : ''}>
        <button type="button" id="classicTab">Box Camisa 10</button>
        <button type="button" id="primeiroTempoTab">Box Primeiro Tempo</button>
      </div>
      <p class="box-description" id="boxDescription"></p>
    </div>

    <div class="field" id="couponField">
      <label class="field-label">Cupom de desconto</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="i_cupom" placeholder="Se você tiver um" value="${d.cupom}" style="flex:1;">
        <button class="btn-ghost" id="cupomBtn">Validar</button>
      </div>
      <div id="cupomMsg"></div>
    </div>

    <div class="plans" id="plansBox"></div>
    <div id="submissionMsg" role="status" aria-live="polite"></div>
  </div>`);

  function renderPlanos(){
    if(caixaPreSelecionada) d.tipoCaixa = caixaPreSelecionada;
    d.tipoCaixa = d.tipoCaixa === 'primeiroTempo' ? 'primeiroTempo' : 'camisa10';
    box.querySelector('#classicTab').classList.toggle('selected', d.tipoCaixa === 'camisa10');
    box.querySelector('#primeiroTempoTab').classList.toggle('selected', d.tipoCaixa === 'primeiroTempo');
    box.querySelector('#classicTab').setAttribute('aria-pressed', String(d.tipoCaixa === 'camisa10'));
    box.querySelector('#primeiroTempoTab').setAttribute('aria-pressed', String(d.tipoCaixa === 'primeiroTempo'));
    box.querySelector('#couponField').style.display = d.tipoCaixa === 'camisa10' ? '' : 'none';
    box.querySelector('#boxDescription').textContent = d.tipoCaixa === 'primeiroTempo'
      ? 'Box Primeiro Tempo — Uma primeira experiência com a Jogada Ensaiada'
      : 'Box Camisa 10 — Sua caixa do seu jeito, nos planos e valores de sempre.';
    const usarCupom = d.cupomValido;
    const p = usarCupom ? PLANOS.cupom : PLANOS.padrao;
    const plansBox = box.querySelector('#plansBox');
    plansBox.innerHTML = '';

    if(d.tipoCaixa === 'primeiroTempo'){
      const primeiroTempo = el(`<div class="plan featured">
        <h3>Box Primeiro Tempo</h3>
        <div class="price">R$ 99,90 <small>/mês</small></div>
        <p class="desc">Sem fidelidade — renova automático, uma caixa por mês.</p>
        <ul><li>100% do valor revertido em produtos</li><li>Frete grátis</li></ul>
        <button class="btn-primary">Continuar para pagamento</button>
      </div>`);
      primeiroTempo.querySelector('button').onclick = () => finalizar(PRIMEIRO_TEMPO_PAYMENT_LINK, 'Box Primeiro Tempo');
      plansBox.appendChild(primeiroTempo);
      return;
    }

    const mensal = el(`<div class="plan">
      <h3>Plano mensal</h3>
      <div class="price">${p.mensal.precoDe?`<span class="old">R$ ${p.mensal.precoDe}</span>`:''}R$ ${p.mensal.preco} <small>/mês</small></div>
      <p class="desc">Sem fidelidade — renova automático, uma caixa por mês.</p>
      <ul><li>100% do valor revertido em produtos</li><li>Frete grátis</li></ul>
      <button class="btn-primary">Assinar mensal</button>
    </div>`);
    mensal.querySelector('button').onclick = ()=> finalizar(p.mensal.link, 'Box Camisa 10 mensal');

    const trimestral = el(`<div class="plan">
      <h3>Plano trimestral</h3>
      <div class="price">${p.trimestral.precoDe?`<span class="old">R$ ${p.trimestral.precoDe}</span>`:''}R$ ${p.trimestral.preco} <small>/mês</small></div>
      <p class="desc">Fidelidade de 3 meses, uma caixa por mês nesse período.</p>
      <ul><li>Prioridade em lançamentos</li><li>100% do valor revertido em produtos</li><li>Frete grátis</li></ul>
      <button class="btn-primary">Assinar trimestral</button>
    </div>`);
    trimestral.querySelector('button').onclick = ()=> finalizar(p.trimestral.link, 'Box Camisa 10 trimestral');

    const anual = el(`<div class="plan featured">
      <span class="badge">Custo-benefício</span>
      <h3>Plano anual</h3>
      <div class="price">R$ ${p.anual.preco} <small>/mês</small></div>
      <p class="desc">Fidelidade de 12 meses, uma caixa por mês — o melhor custo-benefício.</p>
      <ul><li>Caixa extra de aniversário</li><li>Prioridade em lançamentos</li><li>2 trocas por ano</li><li>100% do valor revertido em produtos</li><li>Frete grátis</li></ul>
      <button class="btn-primary">Assinar anual</button>
    </div>`);
    anual.querySelector('button').onclick = ()=> finalizar(p.anual.link, 'Box Camisa 10 anual');

    plansBox.appendChild(mensal);
    plansBox.appendChild(trimestral);
    plansBox.appendChild(anual);
  }

  box.querySelector('#classicTab').onclick = () => { d.tipoCaixa = 'camisa10'; saveDraft(); renderPlanos(); };
  box.querySelector('#primeiroTempoTab').onclick = () => { d.tipoCaixa = 'primeiroTempo'; saveDraft(); renderPlanos(); };

  box.querySelector('#cupomBtn').onclick = ()=>{
    const val = box.querySelector('#i_cupom').value.trim().toUpperCase();
    d.cupom = val;
    const msg = box.querySelector('#cupomMsg');
    if(CUPONS_VALIDOS.includes(val)){
      d.cupomValido = true;
      msg.innerHTML = `<div class="banner ok">✓ Cupom validado! Os valores abaixo já refletem o desconto.</div>`;
    } else {
      d.cupomValido = false;
      msg.innerHTML = `<div class="banner warn">Cupom não encontrado. Confira o código e tente de novo.</div>`;
    }
    saveDraft();
    renderPlanos();
  };

  let enviando = false;
  async function finalizar(link, plano){
    if(enviando) return;
    enviando = true;
    const aviso = box.querySelector('#submissionMsg');
    aviso.innerHTML = '<div class="banner ok"><span class="spinner"></span>Enviando sua curadoria...</div>';
    d.planoEscolhido = plano;
    saveDraft();
    const campos = {
      nome:d.nome, email:d.email, telefone:d.whatsapp, nascimento:d.nascimento,
      team:clubNome(d.clube), cep:d.cep, cidadeConsultada:d.cidade,
      cepDentroArea:d.cepDentroArea ? 'Sim' : 'Não consultado ou fora da área',
      modelagem:d.modelagem, tamanho:d.tamanho, estilo:d.estilo,
      estiloExtra:d.estiloExtra.join(', '), categorias:d.categorias.join(', '),
      origem:d.origem, observations:d.obs, aceiteWhats:d.aceiteWhats ? 'Sim' : 'Não',
      aceiteTermos:d.aceiteTermos ? 'Sim' : 'Não', cupom:d.cupom,
      cupomValido:d.tipoCaixa === 'camisa10' && d.cupomValido ? 'Sim' : 'Não', tipoCaixa:d.tipoCaixa === 'primeiroTempo' ? 'Box Primeiro Tempo' : 'Box Camisa 10',
      planoEscolhido:plano
    };
    const formData = new FormData();
    Object.entries(campos).forEach(([key,value]) => formData.set(key, value == null ? '' : String(value)));
    try{
      // Apps Script recebe FormData; no-cors evita o bloqueio do navegador.
      // A resposta opaca não permite confirmar pelo navegador se o e-mail foi entregue.
      await fetch(GOOGLE_SHEETS_URL, {method:'POST', body:formData, mode:'no-cors'});
      if(link){
        try{ localStorage.removeItem('je_draft'); }catch(e){}
        window.location.href = link;
      } else {
        aviso.innerHTML = '<div class="banner ok">Solicitação enviada. Entre em contato com nosso atendimento para continuar.</div>';
      }
    }catch(e){
      aviso.innerHTML = '<div class="banner warn">Não foi possível enviar agora. Verifique sua conexão e tente novamente.</div>';
    }finally{
      enviando = false;
    }
  }

  renderPlanos();
  return box;
}

const renderers = {
  hero: renderHero,
  clube: renderClube,
  dados: renderDados,
  cep: renderCep,
  modelagem: renderModelagem,
  tamanho: renderTamanho,
  estilo: renderEstilo,
  categorias: renderCategorias,
  origem: renderOrigem,
  consentimento: renderConsentimento,
  checkout: renderCheckout
};

/* =========================================================
   BOOT
   ========================================================= */
const boxDaPagina = new URLSearchParams(window.location.search).get('box');
const caixaPreSelecionada = ['primeiroTempo', 'camisa10'].includes(boxDaPagina) ? boxDaPagina : null;
loadDraft();
if(caixaPreSelecionada) state.data.tipoCaixa = caixaPreSelecionada;
render();
</script>
</body>
</html>
